name: Guardian registration security
on:
  pull_request:
    paths:
      - 'common-contract/pdo/contracts/guardian/**'
      - 'common-contract/etc/guardian_service.toml'
      - 'tests/test_guardian_registration.py'
      - '.github/workflows/guardian-registration.yml'
permissions:
  contents: read
jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography jsonschema
      - run: python -m unittest discover -s tests -p test_guardian_registration.py
